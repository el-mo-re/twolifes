<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Two Lives">
<meta name="theme-color" content="#fdfdfc">
<title>Two Small Lives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE  quiet, tender, observational
   IDEA   a naturalist's field notebook beside a tiny living world
   PICTURE the whole screen is their world; notes appear only on tap
   COLOUR paper white, graphite lines, coral and teal for the two lives, Munich weather on top
   TYPE   Nunito for their words, Instrument Sans for the notes */
:root{color-scheme:light;--ink:#2a2a27;--mute:#85857c;--paper:#fdfdfc;--line:#e6e6e0}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--paper);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#note{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:min(440px,calc(100vw - 28px));max-height:calc(100vh - 28px - env(safe-area-inset-top));overflow:auto;background:rgba(253,253,252,.95);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:18px 18px 14px;font:14px/1.45 'Instrument Sans',system-ui,sans-serif;color:var(--ink);box-shadow:0 14px 44px rgba(30,30,20,.09);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .35s,transform .35s}
#note.on{opacity:1;transform:none;pointer-events:auto}
@media (prefers-reduced-motion:reduce){#note{transition:none}}
h1{font:600 21px/1.1 'Instrument Sans',system-ui,sans-serif;margin:0 0 4px;text-wrap:balance}
h2{font:600 13px/1.2 'Instrument Sans',system-ui,sans-serif;color:var(--mute);margin:14px 0 6px}
.sub{color:var(--mute);margin:0 0 14px;font-size:13px}
.sub b{color:var(--ink);font-family:Nunito,system-ui,sans-serif}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
.cr{display:flex;flex-direction:column;gap:1px}
.cr b{font:800 19px/1.2 Nunito,system-ui,sans-serif;display:flex;align-items:center;gap:7px}
.cr small{color:var(--mute);font-size:13px}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--mute);padding:0 0 4px}
td{padding:5px 6px 5px 0;border-top:1px solid #efefea;vertical-align:baseline}
td.w{font:700 15px Nunito,system-ui,sans-serif;white-space:nowrap}
tr.sh td.w{color:#1f6f64}
.chr{list-style:none;margin:0;padding:0;font-size:13px}
.chr li{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:6px;padding:3px 0;border-top:1px solid #efefea}
.chr time{color:var(--mute);font-variant-numeric:tabular-nums}
.empty{color:var(--mute);font-size:13px;margin:4px 0 0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button{font:600 13px 'Instrument Sans',system-ui,sans-serif;min-height:44px;padding:0 15px;border-radius:22px;border:1px solid #d9d9d2;background:#fff;color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid #1f6f64;outline-offset:2px}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button.warn{border-color:#d9785f;color:#a2432b}
#msg{color:var(--mute);font-size:12.5px;margin:8px 0 0;min-height:1em}
#hint{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));font:13px 'Instrument Sans',system-ui,sans-serif;color:#a9a9a0;transition:opacity 1.2s;pointer-events:none}
</style>
</head>
<body>
<canvas id="w" aria-label="Two small creatures living in a white landscape"></canvas>
<div id="hint">Tap anywhere for field notes. Tap a creature to say hello.</div>
<aside id="note" aria-live="polite">
  <div id="nb"></div>
  <div class="btns">
    <button id="snd">Sound off</button>
    <button id="awk">Keep screen on</button>
    <button id="spd">Speed 1×</button>
    <button id="fs">Full screen</button>
    <button id="new" class="warn">New world</button>
  </div>
  <p id="msg"></p>
</aside>
<script>
{
const cv=document.getElementById('w'),g=cv.getContext('2d');
const U=1000,NH=100,KEY='two-small-lives-v1';
let W=0,H=0,S=1,T=0,ts=1,convo=null,world=null,shake=0,mins=[[],[],[]],minsT=0;
const VIEW={viewer:1},IDLE=12*60e3,PEEKGAP=8*60e3;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const wrap=x=>((x%U)+U)%U;
const wd=(a,b)=>{const d=wrap(b-a);return d>U/2?d-U:d};
const lerp=(a,b,t)=>a+(b-a)*t;
const gauss=()=>{let u=0;while(!u)u=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*Math.random())};
const mul=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mix=(a,b,t)=>{const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),A=p(a),B=p(b);return`rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],clamp(t,0,1)))).join(',')})`};

function resize(){const r=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*r);cv.height=Math.round(H*r);g.setTransform(r,0,0,r,0,0);S=Math.min(W,H*1.3)/760}
addEventListener('resize',resize);resize();

const baseY=l=>H*(.47+.16*l);
const scl=d=>S*(.55+.32*d);
const px=x=>wrap(x)/U*W;
const u=p=>p/W*U;
function hAt(l,x){const a=world.hm[l],p=wrap(x)/U*NH,i=Math.floor(p)%NH,j=(i+1)%NH,t=p-Math.floor(p);return lerp(a[i],a[j],t*t*(3-2*t))}
const gyL=(l,x)=>baseY(l)-hAt(l,x)*H*.05;
function gy(d,x){if(d>2)return gyL(2,x)+(d-2)*H*.16;d=clamp(d,0,2);const l0=Math.floor(d),l1=Math.min(2,l0+1);return lerp(gyL(l0,x),gyL(l1,x),d-l0)}

/* ---------- weather (Munich via Open-Meteo, own weather as fallback) ---------- */
const WX={src:'',code:2,temp:10,rain:0,snow:0,cloud:40,wind:8,wdir:270,at:0};
const E={rain:0,snow:0,cloud:.4,wind:.2,fog:0,storm:0,temp:10,wdir:1,cold:0,hot:0,flash:0};
const WXD={0:'clear',1:'mostly clear',2:'partly cloudy',3:'overcast',45:'fog',48:'icy fog',51:'light drizzle',53:'drizzle',55:'heavy drizzle',56:'freezing drizzle',57:'freezing drizzle',61:'light rain',63:'rain',65:'heavy rain',66:'freezing rain',67:'freezing rain',71:'light snow',73:'snow',75:'heavy snow',77:'snow grains',80:'showers',81:'showers',82:'heavy showers',85:'snow showers',86:'heavy snow showers',95:'thunderstorm',96:'thunderstorm with hail',99:'thunderstorm with hail'};
function wxTarget(){const c=WX.code,rainy=(c>=51&&c<=67)||(c>=80&&c<=82)||c>=95,snowy=(c>=71&&c<=77)||c===85||c===86;
  return{rain:rainy?clamp(.25+WX.rain/3,.25,1):0,snow:snowy?clamp(.3+WX.snow*1.5,.3,1):0,cloud:clamp(WX.cloud/100,0,1),wind:clamp(WX.wind/45,0,1),fog:(c===45||c===48)?1:0,storm:c>=95?1:0,temp:WX.temp,wdir:-Math.sin(WX.wdir*Math.PI/180)>=0?1:-1}}
function simWx(){
  const d=new Date(),m=d.getMonth(),h=d.getHours()+d.getMinutes()/60,avg=[-1,1,5,9,14,17,19,19,14,10,4,0][m];
  const ws=world.ws||(world.ws={mode:'cloudy',until:0,off:0});
  if(Date.now()>ws.until){const cold=avg<4,summer=m>=5&&m<=7,opts=[['clear',.33],['cloudy',.3],['rain',cold?.12:.2],['snow',cold?.13:0],['fog',m>=9||m<=2?.07:.02],['storm',summer?.06:0],['wind',.06]];
    let r=Math.random()*opts.reduce((s,o)=>s+o[1],0);for(const o of opts){r-=o[1];if(r<=0){ws.mode=o[0];break}}ws.until=Date.now()+rnd(30,180)*60e3;ws.off=rnd(-3,3)}
  const temp=avg+ws.off+4*Math.sin((h-9)/24*6.2832);const M={clear:[0,10,0,0,8],cloudy:[3,85,0,0,12],rain:[63,95,1.5,0,16],snow:[73,95,0,1,10],fog:[45,100,0,0,3],storm:[95,100,4,0,30],wind:[2,50,0,0,45]}[ws.mode];
  Object.assign(WX,{src:WX.src==='munich'?'munich':'sim',code:M[0],cloud:M[1],rain:M[2],snow:M[3],wind:M[4],temp:ws.mode==='snow'?Math.min(temp,0):temp})}
async function fetchWx(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=48.137&longitude=11.575&current=temperature_2m,rain,showers,snowfall,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m&timezone=Europe%2FBerlin',{cache:'no-store'});
  if(!r.ok)throw 0;const c=(await r.json()).current;if(!c||c.weather_code===undefined)throw 0;
  Object.assign(WX,{src:'munich',code:c.weather_code,temp:c.temperature_2m,rain:(c.rain||0)+(c.showers||0),snow:c.snowfall||0,cloud:c.cloud_cover,wind:c.wind_speed_10m,wdir:c.wind_direction_10m,at:Date.now()})}
  catch(e){if(WX.src!=='munich'||Date.now()-WX.at>3*3600e3){WX.src='sim';simWx()}}}
function wxKind(){if(E.storm>.5)return'storm';if(E.snow>.2)return'snow';if(E.rain>.2)return'rain';if(E.fog>.5)return'fog';if(E.wind>.6)return'wind';if(E.cold>.6)return'cold';if(E.hot>.3)return'heat';if(E.cloud<.35)return'sun';return'clouds'}
const KINDLOG={storm:'A thunderstorm rolled in',snow:'Snow began to fall',rain:'It started to rain',fog:'Fog crept over the hills',wind:'The wind picked up',cold:'It turned bitterly cold',heat:'The air grew hot',sun:'The sun came out'};

/* ---------- world ---------- */
const PH={c:'mbpdtkgnlrsfvwyhz'.split(''),v:'aeiou'.split('')};
const ACTS=['wander','explore','approach','build','draw','plant','shape','rest','dance','write','eat','harvest','shelter','hide','push'];
const GLOSS={wander:'walking',explore:'looking closely',approach:'coming over',build:'building',draw:'drawing',plant:'planting',shape:'shaping the ground',rest:'sleeping',dance:'dancing',write:'writing',talk:'talking',imitate:'copying a dance',eat:'eating',harvest:'gathering fruit',shelter:'building a hut',hide:'taking shelter',push:'pushing the boulder',greet:'greeting you',peek:'looking for you'};
const PR=[{approach:.6,dance:.35},{wander:.35,explore:.6},{build:.35,draw:.3,plant:.3,shape:.25,dance:.1,write:.25,shelter:.2,push:.2},{rest:.7},{hide:.6,shelter:.45,approach:.15,rest:.1},{eat:.7,harvest:.35}];
const PRIOR=PR.map(r=>ACTS.map(a=>r[a]||0));
const PRIMS=['sway','hop','spin','stretch','squat','wiggle'];
const SPECIES=['flower','bush','reed','glow'];
const NAME=['The coral one','The teal one'],NAMES=['the coral one','the teal one'];

function addObj(k,x,l){const o={id:world.nid++,k,x:wrap(x),l,sz:k==='stone'?+rnd(.7,1.3).toFixed(2):1,yo:0,on:0,hue:-1,g:0,seed:Math.floor(rnd(1e6)),c:-1,up:0,rot:+rnd(-.25,.25).toFixed(2)};world.objs.push(o);return o}
function mkCreature(id){
  const C=[['m','b'],['n','d']][id],gait={f:rnd(.5,3.2),A:rnd(.12,.9),b:rnd(.05,.6)};
  return{id,hue:id?188:14,x:rnd(U),d:id?1:2,dir:1,ph:0,en:.85,nd:[.3,.5,.3,.15,0,.2],v:.1,a:.4,wet:0,store:1,memC:0,plan:null,leaf:0,
    tr:{soc:rnd(.6,1.4),cur:rnd(.6,1.4),cre:rnd(.6,1.4)},protos:[],lex:{},inv:{c:[pick(C)],v:[pick(['a','o','e','u'])]},ordP:rnd(.2,.8),
    Q:PRIOR.map(r=>r.map(p=>p*.5+rnd(.12))),gait,best:{...gait,s:-9,n:0},wk:null,motifs:[],prims:['sway'],strokes:{},
    sty:{amp:rnd(0,7),fr:rnd(.03,.14),base:rnd(1,6)},home:rnd(U),homeL:Math.floor(rnd(3)),seen:{},utter:0,
    act:null,paused:null,carry:-1,say:null,look:null,idle:1,last:-1,lastAct:'',hop:0,tilt:0,mv:null,sit:0,dig:0,blink:rnd(4),pt:0,lastMotif:'',stats:{talk:0,ok:0}}
}
function newWorld(){
  const hm=[0,1,2].map(l=>{const ph=[rnd(6.28),rnd(6.28),rnd(6.28)],amp=[.95,.65,.4][l],a=[];
    for(let i=0;i<NH;i++){const t=i/NH*6.2832;a.push(amp*(.55*Math.sin(t+ph[0])+.3*Math.sin(2*t+ph[1])+.15*Math.sin(3*t+ph[2]))+amp*.45)}return a});
  world={born:Date.now(),saved:Date.now(),age:0,hm,objs:[],marks:[],nid:1,talks:0,clouds:[],snowC:0,wet:0,springs:[],chron:[],nextEv:300,agreed:{},ws:null,bird:null,kind:''};
  migrate();
  const add=(k,l,n)=>{for(let i=0;i<n;i++)addObj(k,rnd(U),l)};
  add('stone',0,3);add('stone',1,4);add('stone',2,3);add('stick',1,2);add('stick',2,1);add('seed',1,2);add('seed',2,1);
  addObj('plant',rnd(U),0).g=1;addObj('plant',rnd(U),2).g=.6;
  world.cr=[mkCreature(0),mkCreature(1)];convo=null;log('Two small lives began')}
function migrate(){
  const w=world;w.chron=w.chron||[];w.springs=w.springs||[];w.snowC=w.snowC||0;w.wet=w.wet||0;w.agreed=w.agreed||{};w.bird=null;w.kind=w.kind||'';
  if(w.nextEv===undefined)w.nextEv=w.age+300;w.clouds=w.clouds||[];while(w.clouds.length<7)w.clouds.push({x:rnd(U),y:rnd(.05,.3),w:rnd(.6,1.4),s:rnd(1.5,4)});
  for(const c of w.cr||[]){while(c.nd.length<6)c.nd.push(0);c.wet=c.wet||0;c.store=c.store??1;c.memC=c.memC||0;c.plan=c.plan||null;c.leaf=c.leaf||0;
    for(let r=0;r<6;r++){if(!c.Q[r])c.Q[r]=PRIOR[r].map(p=>p*.5+rnd(.12));for(let i=0;i<ACTS.length;i++)if(c.Q[r][i]===undefined)c.Q[r][i]=PRIOR[r][i]*.5+rnd(.12)}}}
function log(s){world.chron.unshift({t:Date.now(),s});if(world.chron.length>9)world.chron.length=9}
const obj=id=>world.objs.find(o=>o.id===id);
const count=k=>world.objs.filter(o=>o.k===k).length;
const hasOnTop=o=>world.objs.some(p=>p.on===o.id&&p.c<0);
const live=o=>o.c<0&&!(o.fall>0)&&!(o.roll>0);
const nightF=()=>{const d=new Date(),h=d.getHours()+d.getMinutes()/60;if(h>=22.5||h<6)return 1;if(h>=21.5)return h-21.5;if(h<7)return 7-h;return 0};
const isSleeping=c=>c.act&&c.act.n==='rest'&&c.act.st===2&&c.act.t>2.5&&c.sit>0;
const other=c=>world.cr[1-c.id];
const top=ws=>ws.reduce((a,b)=>b.s>a.s?b:a,ws[0]);
const topW=(c,t)=>{const ws=c.lex[t];return ws&&ws.length?top(ws).w:''};
const kindName=o=>o.k==='plant'?(o.sp||'flower'):o.k;
const hutOf=c=>world.objs.find(o=>o.k==='hut'&&o.own===c.id);
const larder=c=>world.objs.filter(o=>o.k==='fruit'&&live(o)&&o.l===c.homeL&&Math.abs(wd(o.x,c.home))<60).length;
const foodExists=()=>world.objs.some(o=>(o.k==='fruit'&&o.c<0&&!(o.fall>0))||(o.k==='plant'&&o.fr>0));

/* ---------- language ---------- */
function discover(c){const v=Math.random()<.3,pool=(v?PH.v:PH.c).filter(x=>!(v?c.inv.v:c.inv.c).includes(x));if(pool.length)(v?c.inv.v:c.inv.c).push(pick(pool))}
function invent(c,topic){
  const used=new Set();for(const t in c.lex)if(t!==topic)for(const w of c.lex[t])used.add(w.w);
  let w='';for(let k=0;k<8;k++){const n=1+(Math.random()<.55)+(Math.random()<.15),s=[];
    for(let i=0;i<n;i++){let sy=(Math.random()<.85?pick(c.inv.c):'')+pick(c.inv.v);if(Math.random()<.08)sy+=pick(c.inv.c);s.push(sy)}
    if(n===1&&Math.random()<.4)s.push(s[0]);w=s.join('');if(!used.has(w))break}
  return w}
function hear(li,w){let o='';for(const ch of w){const v=PH.v.includes(ch),inv=v?li.inv.v:li.inv.c;if(inv.includes(ch)){o+=ch;continue}if(Math.random()<.2){inv.push(ch);o+=ch}else o+=pick(inv)}return o}
function trimLex(ws){ws.sort((a,b)=>b.s-a.s);if(ws.length>6)ws.length=6}
function naming(sp,li,tS,tL){
  const ws=sp.lex[tS]||(sp.lex[tS]=[]);if(!ws.length)ws.push({w:invent(sp,tS),s:.5});
  trimLex(ws);if(ws[0].s>.9&&Math.random()<.008){const v=[...ws[0].w],i=Math.floor(rnd(v.length)),isV=PH.v.includes(v[i]);v[i]=pick(isV?sp.inv.v:sp.inv.c);const nw=v.join('');if(!ws.some(x=>x.w===nw))ws.push({w:nw,s:.45});trimLex(ws)}
  const w=ws[0].w,h=hear(li,w);
  const wl=li.lex[tL]||(li.lex[tL]=[]);const m=wl.find(x=>x.w===h),ok=!!m&&h===w;
  if(ok){ws[0].s=Math.min(1,ws[0].s+.12);for(let i=1;i<ws.length;i++)ws[i].s-=.12;sp.lex[tS]=ws.filter((x,i)=>!i||x.s>0);
    m.s=Math.min(1,m.s+.12);for(const x of wl)if(x!==m)x.s-=.12;li.lex[tL]=wl.filter(x=>x===m||x.s>0);sp.stats.ok++;
    if(tS===tL&&!tS.startsWith('emo:')&&!world.agreed[tS]&&ws[0].s>.6&&m.s>.6){world.agreed[tS]=w;log(`They agreed on a word for ${gloss(tS)}: “${w}”`)}}
  else{ws[0].s=Math.max(.05,ws[0].s-.03);if(m)m.s+=.05;else wl.push({w:h,s:.3});trimLex(wl)}
  sp.stats.talk++;world.talks++;return{w,h,ok}}
function protoIdx(c,v,a,learn){
  let bi=-1,bd=9;c.protos.forEach((p,i)=>{const d=Math.hypot(p.v-v,(p.a-a)*.8);if(d<bd){bd=d;bi=i}});
  if(learn){if(bi<0||(bd>.38&&c.protos.length<7)){c.protos.push({v,a,n:1});return c.protos.length-1}const p=c.protos[bi];p.v+=(v-p.v)*.03;p.a+=(a-p.a)*.03;p.n++}
  return bi}
function sayIt(c,t,del=0){if(!t)return;c.say={t,life:2.1+t.length*.06,del};c.utter++;if(Math.random()<.012)discover(c);if(!del)voice(c,t)}
function selfTalk(c,topic){const ws=c.lex[topic]||(c.lex[topic]=[]);if(!ws.length)ws.push({w:invent(c,topic),s:.4});trimLex(ws);sayIt(c,ws[0].w)}
function nearObj(c){let b=null,bd=150;for(const o of world.objs){if(!live(o)||Math.abs(o.l-c.d)>1.1)continue;const d=Math.abs(wd(c.x,o.x));if(d<bd){bd=d;b=o}}return b}
function shout(c,topic){const o=other(c);
  if(isSleeping(o)||convo||Math.abs(wd(c.x,o.x))>480){selfTalk(c,topic);return}
  const r1=naming(c,o,'being:'+o.id,'being:'+o.id),r2=naming(c,o,topic,topic);sayIt(c,r1.w+' '+r2.w);o.look=c;
  if((r2.ok&&Math.random()<.85)||Math.random()<.1){if(c.plan&&!o.plan){o.plan={...c.plan,t0:world.age};o.hop=.4;sayIt(o,r2.h,.8);if(o.act&&!['talk','imitate','greet','peek','push'].includes(o.act.n))finish(o,0)}}
  else{o.tilt=1;sayIt(o,r2.h,.8)}}
function exchange(sp,li){

  for(const c of world.cr){c.idle=1;c.face=0;c.knock=0;c.wantGreet=0;c.sit=0;c.dig=0;c.hop=0;c.tilt=0;c.push=0;c.chew=0;if(c.carry>=0&&!obj(c.carry))c.carry=-1}

document.getElementById('awk').onclick=()=>{wantWake=true;wake()};
document.getElementById('spd').onclick=()=>{ts=ts===1?4:ts===4?16:1;notes()};
document.getElementById('fs').onclick=()=>{const d=document.documentElement;try{const p=(d.requestFullscreen||d.webkitRequestFullscreen)?.call(d);if(p&&p.catch)p.catch(()=>{msg.textContent='Full screen isn’t allowed here. Add the page to the Home Screen instead.'});if(!p&&!d.webkitRequestFullscreen)msg.textContent='Full screen isn’t allowed here.'}catch(e){msg.textContent='Full screen isn’t allowed here.'}};
document.getElementById('new').onclick=()=>{if(!confirmNew){confirmNew=true;notes();return}confirmNew=false;newWorld();world.lastSeen=Date.now();for(const c of world.cr)c.wantGreet=.5;save();notes()};
setTimeout(()=>{document.getElementById('hint').style.opacity=0},9000);

/* ---------- start ---------- */
let last=performance.now(),hiddenAt=0;
function catchUp(el){el=Math.min(30*86400,el);if(el<60)return;world.age+=el;for(const o of world.objs)if(o.k==='plant')o.g=Math.min(1,o.g+el/1800);
  for(const c of world.cr){c.en=Math.min(1,c.en+el*.01);c.nd[5]=Math.min(.7,c.nd[5]+el*.0005)}const n=Math.min(el,900)/.1;for(let i=0;i<n;i++)step(.1);
  const I=clamp(Math.log(el/60)/Math.log(1440),.25,1);for(const c of world.cr)c.wantGreet=I}
const fresh=!load();if(fresh)newWorld();simWx();Object.assign(E,wxTarget());E.cold=clamp((6-E.temp)/16,0,1);E.hot=clamp((E.temp-25)/10,0,1);world.kind=world.kind||wxKind();
if(fresh){for(const c of world.cr)c.wantGreet=.5}else catchUp(world.away);world.lastSeen=Date.now();
fetchWx();setInterval(fetchWx,15*60e3);setInterval(()=>{if(WX.src!=='munich')simWx()},60e3);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){hiddenAt=Date.now();save()}else{if(hiddenAt)catchUp((Date.now()-hiddenAt)/1000);hiddenAt=0;world.lastSeen=Date.now();last=performance.now();fetchWx();if(wantWake&&!wl)wake()}});
addEventListener('pagehide',save);setInterval(save,15000);
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;for(let i=0;i<ts;i++)step(dt);render();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
}
</script>
</body>
</html>
